<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | RideAgain Pre-Owned Bikes</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-body">
  <div class="auth-top-controls">
    <button id="rtl" type="button" class="util-btn" aria-label="Toggle right to left">⇄ RTL</button>
    <button id="theme" type="button" class="util-btn" aria-label="Toggle theme">☾ Dark</button>
  </div>

  <main class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="index.html">RIDE<span>AGAIN</span></a>
      <span class="eyebrow">JOIN THE RIDER COMMUNITY</span>
      <h1>Create Your Account</h1>
      <p>Save shortlisted pre-owned motorcycles and track test ride appointments.</p>

      <form id="authForm">
        <label class="field-label" for="signupName">Full Name
          <input id="signupName" type="text" placeholder="Enter your full name" required>
        </label>

        <label class="field-label" for="signupEmail">Email Address
          <input id="signupEmail" type="email" placeholder="rider@example.com" required>
        </label>

        <label class="field-label" for="signupPassword">Password
          <div class="password-wrapper">
            <input id="signupPassword" type="password" placeholder="Create password (min 6 chars)" minlength="6"
              required>
            <button class="eye-toggle" type="button" data-target="signupPassword" aria-label="Show password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </label>

        <label class="field-label" for="signupConfirm">Confirm Password
          <div class="password-wrapper">
            <input id="signupConfirm" type="password" placeholder="Re-enter password" minlength="6" required>
            <button class="eye-toggle" type="button" data-target="signupConfirm" aria-label="Show password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </label>

        <div class="terms-row">
          <input id="termsCheck" type="checkbox" required>
          <label for="termsCheck">I accept the <a href="about.html">Terms &amp; Conditions</a> and dealership privacy
            policy.</label>
        </div>

        <button class="button" type="submit">Create Account</button>
        <p class="status-msg" id="authMsg" role="status"></p>
      </form>

      <div class="auth-divider">Or register with</div>

      <div class="auth-socials" aria-label="Social registration options">
        <button class="auth-social-btn" type="button" data-provider="Google" aria-label="Register with Google"
          title="Google">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z" />
          </svg>
        </button>
        <button class="auth-social-btn" type="button" data-provider="Facebook" aria-label="Register with Facebook"
          title="Facebook">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />
          </svg>
        </button>
        <button class="auth-social-btn" type="button" data-provider="LinkedIn" aria-label="Register with LinkedIn"
          title="LinkedIn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
            <rect x="2" y="9" width="4" height="12" />
            <circle cx="4" cy="4" r="2" />
          </svg>
        </button>
        <button class="auth-social-btn" type="button" data-provider="GitHub" aria-label="Register with GitHub"
          title="GitHub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z" />
          </svg>
        </button>
      </div>

      <p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p>
      <a class="back" href="index.html">← Back to RideAgain Home</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
